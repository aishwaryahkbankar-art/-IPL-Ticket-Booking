<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPL 2026 | Book Tickets</title>

<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- Navigation Bar -->

<header>
    <nav>
        <h2>IPL 2026</h2>

        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="index.html#matches">Matches</a></li>
            <li><a href="booking.html">Book Ticket</a></li>
            <li><a href="index.html#guidelines">Guidelines</a></li>
        </ul>
    </nav>
</header>


<!-- Booking Form Section -->

<section id="booking">

    <h2>IPL 2026 Ticket Booking Form</h2>

    <div class="booking-container">

        <form id="bookingForm" action="#" method="get">

            <!-- Name -->

            <label for="name">Full Name:</label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                minlength="3"
                maxlength="50"
                required
            >


            <!-- Email -->

            <label for="email">Email Address:</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <!-- Phone Number -->

            <label for="phone">Phone Number:</label>

            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter 10-digit phone number"
                pattern="[0-9]{10}"
                minlength="10"
                maxlength="10"
                required
            >


            <!-- Match Selection -->

            <label for="match">Select Match:</label>

            <select id="match" name="match" required>

                <option value="">Choose a Match</option>

                <option value="RCB vs CSK">RCB vs CSK</option>

                <option value="MI vs KKR">MI vs KKR</option>

                <option value="SRH vs RR">SRH vs RR</option>

                <option value="DC vs PBKS">DC vs PBKS</option>

                <option value="GT vs LSG">GT vs LSG</option>

            </select>


            <!-- Stand Category -->

            <label for="stand">Select Stand Category:</label>

            <select id="stand" name="stand" required>

                <option value="">Choose Stand</option>

                <option value="General">General</option>

                <option value="Premium">Premium</option>

                <option value="VIP">VIP</option>

            </select>


            <!-- Number of Tickets -->

            <label for="quantity">Number of Tickets:</label>

            <input
                type="number"
                id="quantity"
                name="quantity"
                min="1"
                max="10"
                step="1"
                placeholder="Enter ticket quantity"
                required
            >


            <!-- Additional Preferences -->

            <label>Additional Preferences:</label>

            <div style="margin-top: 10px;">

                <input
                    type="checkbox"
                    id="food"
                    name="preferences"
                    value="Food"
                    style="width: auto;"
                >

                <label for="food" style="display: inline;">
                    Food Preference
                </label>

                <br>

                <input
                    type="checkbox"
                    id="parking"
                    name="preferences"
                    value="Parking"
                    style="width: auto;"
                >

                <label for="parking" style="display: inline;">
                    Parking Required
                </label>

            </div>


            <!-- Submit and Reset Buttons -->

            <button type="submit">
                Submit Booking
            </button>

            <button type="reset"
                style="background: #555;">
                Reset Form
            </button>

        </form>

    </div>

</section>


<!-- Footer -->

<footer>

    <p>© 2026 IPL Ticket Booking. All Rights Reserved.</p>

    <p>Designed for Cricket Fans ❤️</p>

</footer>
</body>
</html>
